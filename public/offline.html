<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0061a4">
    <title>UniFocus · Sem conexão</title>
    <style>
        :root { color-scheme: light dark; --bg: #f8fafc; --fg: #191c1e; --muted: #404752; --primary: #0061a4; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --fg: #e2e8f0; --muted: #94a3b8; --primary: #9ecaff; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); text-align: center; }
        img { width: 88px; height: 88px; border-radius: 22px; }
        h1 { font-size: 1.35rem; margin: 20px 0 8px; }
        p { margin: 0 auto 24px; max-width: 320px; color: var(--muted); line-height: 1.5; }
        button { border: 0; border-radius: 999px; padding: 10px 24px; font: inherit; font-weight: 600; cursor: pointer;
                 background: var(--primary); color: var(--bg); }
    </style>
</head>
<body>
    <main>
        <img src="/images/pwa/icon-192.png" alt="UniFocus">
        <h1>Você está sem conexão</h1>
        <p>Assim que a internet voltar, o UniFocus abre de novo. Seus dados ficam salvos no servidor.</p>
        <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
</body>
</html>
