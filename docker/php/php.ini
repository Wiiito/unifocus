; Ajustes de PHP para o ambiente de desenvolvimento do Unifocus
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 64M
post_max_size = 64M
date.timezone = America/Sao_Paulo

display_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.enable_cli = 0
; Em desenvolvimento o código vem de um bind mount: revalidar sempre.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
