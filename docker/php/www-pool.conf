; Sobrescreve o pool padrão para rodar como o usuário "app" (UID do host).
[www]
user = app
group = app
listen = 0.0.0.0:9000
listen.owner = app
listen.group = app

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
