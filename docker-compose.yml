###############################################################################
# Unifocus — stack isolada (rede, volumes, imagens e portas próprias).
# Nada aqui é compartilhado com outras stacks existentes na máquina.
###############################################################################
name: unifocus

services:
  # ---------------------------------------------------------------------------
  # PHP 8.4 + Composer + Node (roda o Laravel via FPM e os comandos artisan)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: unifocus/php:8.4
    container_name: unifocus_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Código do repositório ligado ao container (edições no host = no container)
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unifocus

  # ---------------------------------------------------------------------------
  # Servidor web
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.29-alpine
    container_name: unifocus_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - unifocus

  # ---------------------------------------------------------------------------
  # Banco de dados — inicializado a partir das variáveis do .env da raiz
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: unifocus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: America/Sao_Paulo
    volumes:
      # Volume nomeado: os dados sobrevivem a `docker compose down`
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - unifocus

  # ---------------------------------------------------------------------------
  # WhoDB — gerenciador do banco (perfil de conexão já pré-configurado)
  # ---------------------------------------------------------------------------
  whodb:
    image: clidey/whodb:0.127.0
    container_name: unifocus_whodb
    restart: unless-stopped
    ports:
      - "${WHODB_PORT:-8081}:8080"
    environment:
      WHODB_POSTGRES_1: '{"alias":"Unifocus (local)","host":"postgres","port":"5432","user":"${DB_USERNAME}","password":"${DB_PASSWORD}","database":"${DB_DATABASE}"}'
    volumes:
      - whodb_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - unifocus

networks:
  unifocus:
    name: unifocus
    driver: bridge

volumes:
  pgdata:
    name: unifocus_pgdata
  whodb_data:
    name: unifocus_whodb_data
